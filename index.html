    function settingRow(k,title,sub){return `<div class="setting-row"><div><b>${title}</b><small>${sub}</small></div><button class="toggle ${state.settings[k]?'on':''}" aria-label="Alternar ${title}" onclick="state.settings['${k}']=!state.settings['${k}'];render();scheduleSync();toast('Preferência atualizada')"></button></div>`}
    function setSound(value){state.settings.sound=value;scheduleSync();playSound(value);toast('Som de notificação atualizado')}
    function playSound(choice=state.settings.sound){if(!choice||choice===true)choice='gentle';if(choice==='none'||choice===false)return;if(choice==='custom'&&state.settings.customSound?.data){const media=new Audio(state.settings.customSound.data);media.play().catch(()=>toast('Toque em “Testar” uma vez para liberar o áudio',true));return}const C=window.AudioContext||window.webkitAudioContext,ctx=window.ordoAudioContext||(window.ordoAudioContext=new C()),patterns={gentle:[[660,.12],[880,.18]],bell:[[880,.1],[1175,.12],[880,.28]],digital:[[520,.08],[520,.08],[1040,.16]]},notes=patterns[choice]||patterns.gentle;ctx.resume();let at=ctx.currentTime;notes.forEach(([freq,dur])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=choice==='digital'?'square':'sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.18,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+dur);at+=dur+.05})}
    function uploadCustomSound(input){const f=input.files[0];if(!f)return;if(f.size>2097152||(!f.type.startsWith('audio/')&&f.type!=='video/mp4')){input.value='';return toast('Escolha um MP3, MP4 ou áudio de até 2 MB',true)}const r=new FileReader();r.onload=()=>{state.settings.customSound={name:f.name,data:r.result,type:f.type};state.settings.sound='custom';scheduleSync();render();playSound('custom');toast('Som personalizado adicionado')};r.readAsDataURL(f)}

    function calculateSchedule(start,intervalMinutes){if(!validTime(start)||!Number.isFinite(intervalMinutes)||intervalMinutes<1||intervalMinutes>1440)return[];const [h,m]=start.split(':').map(Number),base=h*60+m,count=Math.ceil(1440/intervalMinutes),out=[];for(let n=0;n<count;n++){const v=(base+n*intervalMinutes)%1440;out.push(String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'))}return[...new Set(out)]}

    function openEditItem(id){state.activeItemId=id;const i=getItem(id),p=intervalParts(i),start=i.startTime||itemTimes(i)[0]||'08:00';modal(`<div class="modal-head"><div><h2>Editar item</h2><p class="subtext" style="margin-top:6px">As mudanças serão sincronizadas</p></div><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Nome</label><input id="eName" value="${esc(i.name)}"></div><div class="field"><label>Descrição</label><textarea id="eDesc">${esc(i.description||'')}</textarea></div>${i.qty!==null?`<div class="field-row"><div class="field"><label>Quantidade atual</label><input id="eQty" type="number" min="0" step="any" value="${i.qty}"></div><div class="field"><label>Unidade</label><input id="eUnit" value="${esc(i.unit)}"></div></div><div class="field-row"><div class="field"><label>Alerta de estoque mínimo</label><input id="eMin" type="number" min="0" step="any" value="${i.minQty||0}"></div><div class="field"><label>Reposição padrão</label><input id="eReplenish" type="number" min="1" step="any" value="${i.replenishQty||i.total||1}"></div></div><div class="field-row"><div class="field"><label>Começa a tomar às</label><input id="eStart" type="time" value="${start}" oninput="updateEditSchedule()"></div><div class="field"><label>Repetir a cada</label><div style="display:flex;gap:8px"><input id="eInterval" type="number" min="1" value="${p.value}" oninput="updateEditSchedule()"><select id="eIntervalUnit" onchange="updateEditSchedule()"><option value="hours" ${p.unit==='hours'?'selected':''}>horas</option><option value="minutes" ${p.unit==='minutes'?'selected':''}>minutos</option></select></div></div></div><small class="subtext">O intervalo máximo é de 24 horas.</small><div id="editSchedule">${scheduleChips(calculateSchedule(start,p.unit==='hours'?p.value*60:p.value))}</div>`:`<div class="field"><label>Data</label><input id="eDate" value="${esc(i.nextDose||'')}" placeholder="DD/MM/AAAA"></div><div class="field"><label>Horários das noti     function stepTwo(){const d=state.addData,alarm=`<div class="alarm-box"><div><b>Ativar notificações</b><small>Avisar nos horários escolhidos</small></div><button class="toggle ${state.addAlarm?'on':''}" onclick="saveStepData();state.addAlarm=!state.addAlarm;drawAdd()"></button></div>`,times=state.addAlarm?`<div class="field"><label>Horários das notificações</label><input id="aTimes" value="${esc(d.times||'08:00')}" placeholder="Ex: 08:00, 14:00, 22:00"><small class="subtext" style="display:block;margin-top:6px">Você pode definir um ou vários horários separados por vírgula.</small></div>`:'';if(state.addTipo==='quantidade')return `<h3>Informações básicas</h3><div class="field"><label>Nome *</label><input id="aName" value="${esc(d.name||'')}" placeholder="Nome do item"></div><div class="field"><label>Descrição (opcional)</label><textarea id="aDesc" placeholder="Adicione uma observação">${esc(d.description||'')}</textarea></div><div class="field-row"><div class="field"><label>Unidade</label><select id="aUnit">${['Comprimido','Cápsula','Dose','Unidade','Caixa','Pacote','Kg','g','ml','Litro','Fralda','Saquinho'].map(x=>`<option ${d.unit===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Quantidade inicial</label><input id="aQty" type="number" min="1" step="any" value="${d.qty||1}"></div></div><div class="field-row"><div class="field"><label>Consumo por dose</label><input id="aDose" type="number" min="1" step="any" value="${d.dose||1}"></div><div class="field"><label>Quantidade mínima</label><input id="aMin" type="number" min="0" step="any" value="${d.minQty||1}"></div></div><div class="field"><label>Quantidade padrão de reposição</label><input id="aReplenish" type="number" min="1" step="any" value="${d.replenishQty||d.qty||1}"><small class="subtext" style="display:block;margin-top:6px">Será sugerida ao tocar em “Repor”, mas poderá ser alterada.</small></div><div class="field"><label>Frequência</label><select id="aFreq">${['A cada 4h','A cada 8h','A cada 12h','Uma vez ao dia','Quando necessário'].map(x=>`<option ${d.freq===x?'selected':''}>${x}</option>`).join('')}</select></div>${alarm}${times}`;return `<h3>Informações básicas</h3><div class="field"><label>Nome *</label><input id="aName" value="${esc(d.name||'')}" placeholder="Nome do item"></div><div class="field"><label>Descrição (opcional)</label><textarea id="aDesc" placeholder="Adicione uma observação">${esc(d.description||'')}</textarea></div><div class="field"><label>Data (opcional)</label><input id="aDate" type="date" value="${esc(d.date||'')}"></div>${alarm}${times}`}
    function saveStepData(){const val=id=>$(id)?.value;if(state.addStep!==2)return;state.addData={...state.addData,name:val('#aName')||'',description:val('#aDesc')||'',times:val('#aTimes')||state.addData.times||''};if(state.addTipo==='quantidade')Object.assign(state.addData,{unit:val('#aUnit'),qty:Number(val('#aQty')),dose:Number(val('#aDose')),minQty:Number(val('#aMin')),replenishQty:Number(val('#aReplenish')),freq:val('#aFreq')});else Object.assign(state.addData,{date:val('#aDate')})}
    function stepTwo(){const d=state.addData,start=d.startTime||'08:00',ival=d.intervalValue||8,iunit=d.intervalUnit||'hours',mins=iunit==='hours'?ival*60:ival,alarm=`<div class="alarm-box"><div><b>Ativar notificações</b><small>Tocar nos horários calculados</small></div><button class="toggle ${state.addAlarm?'on':''}" onclick="saveStepData();state.addAlarm=!state.addAlarm;drawAdd()"></button></div>`;if(state.addTipo==='quantidade')return `<h3>Informações básicas</h3><div class="field"><label>Nome *</label><input id="aName" value="${esc(d.name||'')}" placeholder="Nome do item"></div><div class="field"><label>Descrição (opcional)</label><textarea id="aDesc" placeholder="Adicione uma observação">${esc(d.description||'')}</textarea></div><div class="field-row"><div class="field"><label>Unidade</label><select id="aUnit">${['Comprimido','Cápsula','Dose','Unidade','Caixa','Pacote','Kg','g','ml','Litro','Fralda','Saquinho'].map(x=>`<option ${d.unit===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Quantidade inicial</label><input id="aQty" type="number" min="1" step="any" value="${d.qty||1}"></div></div><div class="field-row"><div class="field"><label>Consumo por dose</label><input id="aDose" type="number" min="1" step="any" value="${d.dose||1}"></div><div class="field"><label>Quantidade mínima</label><input id="aMin" type="number" min="0" step="any" value="${d.minQty||1}"></div></div><div class="field"><label>Quantidade padrão de reposição</label><input id="aReplenish" type="number" min="1" step="any" value="${d.replenishQty||d.qty||1}"></div><div class="field-row"><div class="field"><label>Começa a tomar às</label><input id="aStart" type="time" value="${start}" oninput="updateAddSchedule()"></div><div class="field"><label>Repetir a cada</label><div style="display:flex;gap:8px"><input id="aInterval" type="number" min="1" value="${ival}" oninput="updateAddSchedule()"><select id="aIntervalUnit" onchange="updateAddSchedule()"><option value="hours" ${iunit==='hours'?'selected':''}>horas</option><option value="minutes" ${iunit==='minutes'?'selected':''}>minutos</option></select></div></div></div><small class="subtext">Entre 1 minuto e 24 horas. Horários das próximas 24h:</small><div id="addSchedule">${scheduleChips(calculateSchedule(start,mins))}</div>${alarm}`;return `<h3>Informações básicas</h3><div class="field"><label>Nome *</label><input id="aName" value="${esc(d.name||'')}" placeholder="Nome do item"></div><div class="field"><label>Descrição (opcional)</label><textarea id="aDesc">${esc(d.description||'')}</textarea></div><div class="field"><label>Data (opcional)</label><input id="aDate" type="date" value="${esc(d.date||'')}"></div>${alarm}${state.addAlarm?`<div class="field"><label>Horários das notificações</label><input id="aTimes" value="${esc(d.times||'08:00')}" placeholder="08:00, 14:00"></div>`:''}`}
    function updateAddSchedule(){const value=Number($('#aInterval')?.value),unit=$('#aIntervalUnit')?.value,mins=unit==='hours'?value*60:value,times=calculateSchedule($('#aStart')?.value,mins),box=$('#addSchedule');if(box)box.innerHTML=scheduleChips(times)}
    function saveStepData(){const val=id=>$(id)?.value;if(state.addStep!==2)return;state.addData={...state.addData,name:val('#aName')||'',description:val('#aDesc')||''};if(state.addTipo==='quantidade')Object.assign(state.addData,{unit:val('#aUnit'),qty:Number(val('#aQty')),dose:Number(val('#aDose')),minQty:Number(val('#aMin')),replenishQty:Number(val('#aReplenish')),startTime:val('#aStart'),intervalValue:Number(val('#aInterval')),intervalUnit:val('#aIntervalUnit')});else Object.assign(state.addData,{date:val('#aDate'),times:val('#aTimes')||state.addData.times||''})}
    function nextAdd(){if(state.addStep===2){saveStepData();const d=state.addData;if(!d.name.trim())return toast('Informe o nome do item',true);if(state.addTipo==='quantidade'){if(d.qty<1)return toast('A quantidade deve ser maior que zero',true);const mins=d.intervalUnit==='hours'?d.intervalValue*60:d.intervalValue;if(!Number.isFinite(mins)||mins<1||mins>1440)return toast('O intervalo deve ficar entre 1 minuto e 24 horas',true);if(!validTime(d.startTime))return toast('Informe o horário inicial',true)}else{const times=parseTimes(d.times);if(state.addAlarm&&(!times.length||times.some(t=>!validTime(t))))return toast('Informe os horários no formato HH:MM',true)}}state.addStep++;drawAdd()}
    function prevAdd(){if(state.addStep===2)saveStepData();state.addStep--;drawAdd()}
    function stepThree(){const d=state.addData,c=getCat(state.activeCategoryId),times=parseTimes(d.times).join(', ')||'—',rows=state.addTipo==='quantidade'?[['Quantidade',`${d.qty} ${d.unit}`],['Reposição padrão',`${d.replenishQty} ${d.unit}`],['Consumo por dose',d.dose],['Frequência',d.freq],['Alerta mínimo',`${d.minQty} ${d.unit}`],['Notificações',state.addAlarm?times:'Desativadas']]:[['Data',d.date?new Date(d.date+'T12:00:00').toLocaleDateString('pt-BR'):'Não informada'],['Notificações',state.addAlarm?times:'Desativadas']];return `<h3>Revise o item</h3><div class="summary-card"><span class="cat-icon">${c.icon}</span><div><strong>${esc(d.name)}</strong><div style="margin-top:7px"><span class="badge">${esc(c.name)}</span> <span class="badge green">${state.addTipo==='quantidade'?'Com quantidade':'Sem quantidade'}</span></div></div></div>${d.description?`<p class="subtext" style="margin-bottom:15px">${esc(d.description)}</p>`:''}<div class="summary-table">${rows.map(r=>`<div class="summary-row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`}
    function saveItem(){const d=state.addData,cid=state.activeCategoryId,id=Date.now(),times=state.addAlarm?parseTimes(d.times):[];state.items[cid].push(state.addTipo==='quantidade'?{id,name:d.name,description:d.description,qty:d.qty,total:d.qty,unit:d.unit.toLowerCase()+(d.qty!==1&&!/s$/.test(d.unit.toLowerCase())?'s':''),freq:d.freq,nextDose:times[0]||'',notifyTimes:times,replenishQty:d.replenishQty||d.qty,minQty:d.minQty,alarm:state.addAlarm,notif:true,tipo:'quantidade'}:{id,name:d.name,description:d.description,qty:null,total:null,unit:'',freq:'',nextDose:d.date?new Date(d.date+'T12:00:00').toLocaleDateString('pt-BR'):'',notifyTimes:times,minQty:0,alarm:state.addAlarm,notif:state.addAlarm,tipo:'semquantidade'});closeModal();render();scheduleSync();toast('Item adicionado com sucesso')}
    function frequencyLabel(value,unit){return `A cada ${value} ${unit==='hours'?(value===1?'hora':'horas'):(value===1?'minuto':'minutos')}`}
    function stepThree(){const d=state.addData,c=getCat(state.activeCategoryId),mins=d.intervalUnit==='hours'?d.intervalValue*60:d.intervalValue,times=state.addTipo==='quantidade'?calculateSchedule(d.startTime,mins):parseTimes(d.times),rows=state.addTipo==='quantidade'?[['Quantidade',`${d.qty} ${d.unit}`],['Reposição padrão',`${d.replenishQty} ${d.unit}`],['Intervalo',frequencyLabel(d.intervalValue,d.intervalUnit)],['Começa às',d.startTime],['Horários',times.join(', ')],['Notificações',state.addAlarm?'Ativas':'Desativadas']]:[['Data',d.date?new Date(d.date+'T12:00:00').toLocaleDateString('pt-BR'):'Não informada'],['Notificações',state.addAlarm?(times.join(', ')||'—'):'Desativadas']];return `<h3>Revise o item</h3><div class="summary-card"><span class="cat-icon">${c.icon}</span><div><strong>${esc(d.name)}</strong><div style="margin-top:7px"><span class="badge">${esc(c.name)}</span> <span class="badge green">${state.addTipo==='quantidade'?'Com quantidade':'Sem quantidade'}</span></div></div></div>${d.description?`<p class="subtext" style="margin-bottom:15px">${esc(d.description)}</p>`:''}<div class="summary-table">${rows.map(r=>`<div class="summary-row"><span>${r[0]}</span><b style="max-width:65%;text-align:right">${esc(r[1])}</b></div>`).join('')}</div>`}
    function saveItem(){const d=state.addData,cid=state.activeCategoryId,id=Date.now();if(state.addTipo==='quantidade'){const mins=d.intervalUnit==='hours'?d.intervalValue*60:d.intervalValue,times=calculateSchedule(d.startTime,mins);state.items[cid].push({id,name:d.name,description:d.description,qty:d.qty,total:d.qty,unit:d.unit.toLowerCase()+(d.qty!==1&&!/s$/.test(d.unit.toLowerCase())?'s':''),freq:frequencyLabel(d.intervalValue,d.intervalUnit),startTime:d.startTime,intervalMinutes:mins,nextDose:times[0]||'',notifyTimes:times,replenishQty:d.replenishQty||d.qty,minQty:d.minQty,alarm:state.addAlarm,notif:state.addAlarm,tipo:'quantidade'})}else{const times=state.addAlarm?parseTimes(d.times):[];state.items[cid].push({id,name:d.name,description:d.description,qty:null,total:null,unit:'',freq:'',nextDose:d.date?new Date(d.date+'T12:00:00').toLocaleDateString('pt-BR'):'',notifyTimes:times,minQty:0,alarm:state.addAlarm,notif:state.addAlarm,tipo:'semquantidade'})}closeModal();render();scheduleSync();toast('Item adicionado com sucesso')}
    const notifiedNow=new Set();
    function checkDueNotifications(){if(!auth.session||!state.settings.push)return;const now=new Date(),hm=now.toTimeString().slice(0,5),day=now.toISOString().slice(0,10);allItems().filter(i=>i.alarm&&itemTimes(i).includes(hm)).forEach(i=>{const key=`${day}-${hm}-${i.id}`;if(notifiedNow.has(key))return;notifiedNow.add(key);playSound();toast(`Hora de: ${i.name}`);if('Notification'in window&&Notification.permission==='granted')new Notification('Ordo — lembrete',{body:`${i.name} · ${hm}`,tag:key})})}
    function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=(error?'⚠ ':'✓ ')+msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3200)}
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('online',()=>saveCloudState());setInterval(checkDueNotifications,20000);initAuth();
  </script>
